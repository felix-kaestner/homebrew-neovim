name: Update Neovim Nightly Checksum

on:
  schedule:
    # Runs every day at 5:30 AM UTC
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-checksum:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cask Checksums
        run: |
          set -e

          echo "Fetching latest nightly release information..."
          RELEASE_INFO=$(curl -s https://api.github.com/repos/neovim/neovim/releases/tags/nightly)

          echo "Parsing checksums from release metadata..."
          ARM64_SHA256=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name == "nvim-macos-arm64.tar.gz") | .digest' | sed 's/^sha256://')
          X86_64_SHA256=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name == "nvim-macos-x86_64.tar.gz") | .digest' | sed 's/^sha256://')

          if ! echo "$ARM64_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "ARM64 checksum is not a valid SHA-256 digest: $ARM64_SHA256"
            exit 1
          fi
          if ! echo "$X86_64_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "x86_64 checksum is not a valid SHA-256 digest: $X86_64_SHA256"
            exit 1
          fi

          echo "ARM64 SHA256: $ARM64_SHA256"
          echo "x86_64 SHA256: $X86_64_SHA256"

          CASK_FILE="Casks/neovim-nightly.rb"

          sed -i "s/arm:   \"[a-f0-9]\{64\}\"/arm:   \"$ARM64_SHA256\"/" "$CASK_FILE"
          sed -i "s/intel: \"[a-f0-9]\{64\}\"/intel: \"$X86_64_SHA256\"/" "$CASK_FILE"

          echo "Cask file updated."

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if ! git diff-index --quiet HEAD; then
            echo "Changes detected. Committing and pushing..."
            git add Casks/neovim-nightly.rb
            git commit -m "chore: Update neovim-nightly checksums"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test-install:
    needs: update-checksum
    if: needs.update-checksum.outputs.changed == 'true'
    uses: ./.github/workflows/test-install.yml
